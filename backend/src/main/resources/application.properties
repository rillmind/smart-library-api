spring.application.name=api
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.session.store-type=redis
app.cors.allowed-origin=http://localhost:5173

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartlibrarydb}
spring.datasource.username=${DB_USER:smartlibrary_user}
spring.datasource.password=${DB_PASSWORD:smartlibrary_pass}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis_senha_segura}